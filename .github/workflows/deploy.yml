name: Deploy Resume

on:
  push:
    branches: [ main ]  # 当main分支有推送时触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 进入项目目录
            cd /project/sakana-resume
            
            # 拉取最新代码
            git pull origin main
            
            # 停止并删除旧容器
            docker stop sakana-resume || true
            docker rm sakana-resume || true
            
            # 构建新镜像
            docker build -t sakana-resume .
            
            # 运行新容器
            docker run -d \
              --name sakana-resume \
              -p 3890:80 \
              --restart unless-stopped \
              sakana-resume 